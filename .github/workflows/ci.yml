name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Testes, tipos e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria AST de documentação
        run: npm run docs:verificar

      - name: Testes determinísticos
        run: npm test -- --run --maxWorkers=1

      - name: Checagem TypeScript
        run: npm run typecheck

      - name: Missões sem APIs de navegador
        run: npm run typecheck:missoes

      - name: Build de produção
        run: npm run build

      - name: Recursos e rotas do site unificado
        run: npm run site:verificar

      - name: Smoke de navegador do site e dos simuladores
        run: npm run site:smoke
